version: 2
# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

formats: all

# Read the Docs supports uv natively here, so we do not need to override
# build.jobs. This installs the project plus the docs dependency group.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  # Path to your Sphinx configuration file.
  configuration: docs/conf.py
