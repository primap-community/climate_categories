name: Update citation info

# Called by the release workflow, and dispatchable by hand in case zenodo took longer
# than the release run was willing to wait.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Version whose zenodo record to wait for, e.g. 0.11.2

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  update-citation:
    name: Update the citation information in the README
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"

      # Waits for zenodo to mint the DOI for the new release, which takes a few
      # minutes after the GitHub release is created.
      - name: Update the citation information
        run: >
          uv run --with requests --no-project python update_citation_info.py
          --wait-for-version "${{ inputs.version }}"

      - name: Commit the updated README
        run: |
          if git diff --quiet -- README.rst; then
            echo "README.rst is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update citation information for version ${{ inputs.version }}" README.rst
          git push origin main
