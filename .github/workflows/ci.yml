name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # allows you to trigger the workflow run manually

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and caching
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution }}"
          cache-dependency-glob: "pyproject.toml"
          version: "0.12.7"

      - name: Create venv
        run: uv venv --seed --python ${{ matrix.python-version }}

      # Deliberately resolve newly instead of from uv.lock - we test
      # different resolution strategies.
      - name: Install ${{ matrix.resolution }} dependencies
        run: uv pip install --resolution ${{ matrix.resolution }} .[test]

      # Runs against the ./.venv built above.
      - name: Test with pytest
        run: >
          uv run --no-project --python .venv
          pytest --cov=climate_categories --cov-report=xml
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
