option: territories_in_sovereign_inventory
title: territories included in the inventory of their sovereign country
comment: Dependent territories which are included in the national greenhouse gas
  inventory of their sovereign country under the UNFCCC are not listed
  separately, but included in their sovereign country, like the Faroe Islands
  (FRO) and Greenland (GRL) in Denmark (DNK). Territories which are not included
  in the inventory of their sovereign country, like Aruba (ABW), Anguilla (AIA),
  or Montserrat (MSR), are kept. Territories without permanent population are
  not included, use the option no_unpopulated to remove them.
references: "UK Greenhouse Gas Inventory, 1990 to 2024, chapter 1, https://unfccc.int/sites/default/files/resource/NID%2090-24.pdf;\n\
  Inventaire des émissions de gaz à effet de serre en France de 1990 à 2019, section
  1.7, https://citepa.org/?p=20926;\nInventory of U.S. Greenhouse Gas Emissions and
  Sinks 1990-2022, chapter 3, https://www.epa.gov/system/files/documents/2024-04/us-ghg-inventory-2024-chapter-3-energy.pdf;\n\
  National Inventory Report 2022, volume 1, section 1.7.2, https://www.dcceew.gov.au/climate-change/publications/national-inventory-reports;\n\
  Denmark's National Inventory Document 2026, chapter 1, https://unfccc.int/sites/default/files/resource/Denmark%27s%20National%20Inventory%20Document%202026.pdf;\n\
  Greenhouse Gas Emissions 1990-2024, National Inventory Document (Norway), section
  1.7.1, https://unfccc.int/sites/default/files/resource/Norway%20National%20Inventory%20Document%202026.pdf;\n\
  Greenhouse gas emissions in Finland 1990 to 2019, section 1.7, https://stat.fi/meta/kas/nir_en.html"
last_update: '2026-10-12'
