option: gcam
title: GCAM regions
comment: Regions used in the GCAM integrated assessment model of the Joint
  Global Change Research Institute, for all GCAM versions. Regions which are
  identical in multiple GCAM versions are a single category, with codes for all
  versions.
references: "GCAM version 4.0 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v4.0/Main_User_Workspace/input/gcam-data-system/_common/mappings/iso_GCAM_regID.csv;\n\
  GCAM versions 4.1, 4.2, 4.3, 4.4, 4.4.1, 5.1, 5.1.1, 5.1.2, 5.1.3 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v4.1/Main_User_Workspace/input/gcam-data-system/_common/mappings/iso_GCAM_regID.csv;\n\
  GCAM version 5.2 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v5.2/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv;\n\
  GCAM version 5.3 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v5.3/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv;\n\
  GCAM versions 5.4, 6.0, 7.0, 7.1 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v5.4/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv;\n\
  GCAM versions 7.2, 7.3 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v7.2/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv;\n\
  GCAM versions 7.4, 8.0 regions, https://github.com/JGCRI/gcam-core/blob/gcam-v7.4/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv;\n\
  GCAM versions 8.1, 8.2, 8.3, 8.4, 8.5, 8.6, 8.7, 8.8, 8.9, 8.10, 8.11, 9.0, 9.1
  regions, https://github.com/JGCRI/gcam-core/blob/gcam-v8.1/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv;\n\
  GCAM version 3.0 regions, region_GCAM3 column of https://github.com/JGCRI/gcam-core/blob/gcam-v9.1/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv"
last_update: '2026-09-24'
