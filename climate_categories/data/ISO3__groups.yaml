option: groups
title: country groups
comment: 'Groups of countries in climate negotiations and international politics:
  AOSIS, BASIC, LDC, the Umbrella Group, the Arab Group, LMDC, G35, G7, G8, G20, OECD,
  and OPEC.'
references: "G7 and G20, https://www.bmuv.de/themen/europa-internationales/internationales/g7-und-g20;\n\
  OECD members, https://www.oecd.org/about/document/ratification-oecd-convention.htm;\n\
  UMBRELLA https://unfccc.int/process-and-meetings/parties-non-party-stakeholders/parties/party-groupings;\n\
  LDC https://www.un.org/development/desa/dpad/wp-content/uploads/sites/45/publication/ldc_list.pdf;\n\
  AOSIS members, https://www.aosis.org/about/member-states/;\nOPEC https://www.opec.org/member-countries.html;\n\
  ARAB https://unfccc.int/party-groupings;\nLMDC https://en.wikipedia.org/wiki/Like-Minded_Developing_Countries"
