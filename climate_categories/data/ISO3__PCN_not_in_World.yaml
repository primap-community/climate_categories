option: PCN_not_in_World
title: Pitcairn not part of World
comment: Pitcairn (PCN) is not part of World, but stays available as a category.
  Practically no emissions data exist for Pitcairn, so use this for data sets
  which do not report it, so that World contains only countries and territories
  with data.
